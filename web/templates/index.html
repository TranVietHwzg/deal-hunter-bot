<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deal Hunter Dashboard - Bot Săn Deal & Voucher Cá Nhân</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Alpine.js CDN -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#6366f1', 600: '#4f46e5' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased selection:bg-indigo-500 selection:text-white"
      x-data="dashboardApp()" x-init="initData()">

  <!-- Top Navigation -->
  <header class="border-b border-slate-800/80 bg-slate-900/60 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center shadow-lg shadow-indigo-500/20">
          <i class="fa-solid fa-bolt text-lg text-white"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold tracking-tight bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">DEAL HUNTER PRO</h1>
          <p class="text-xs text-slate-400">Bot Săn Deal & Gộp Voucher Cá Nhân</p>
        </div>
      </div>

      <!-- Action buttons -->
      <div class="flex items-center space-x-3">
        <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping mr-1.5"></span>
          Bot Đang Chạy
        </span>
        <button @click="triggerScan()" :disabled="scanning" class="px-3.5 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-semibold shadow-md transition flex items-center space-x-2 disabled:opacity-50">
          <i class="fa-solid fa-arrows-rotate" :class="{ 'animate-spin': scanning }"></i>
          <span x-text="scanning ? 'Đang Quét...' : 'Quét Ngay'"></span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">

    <!-- Metrics Grid -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="p-5 rounded-2xl bg-slate-900/60 border border-slate-800 shadow-sm">
        <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">Món Đang Canh</p>
        <p class="text-3xl font-extrabold text-white mt-2" x-text="stats.total_products"></p>
        <p class="text-xs text-indigo-400 mt-1"><i class="fa-solid fa-eye mr-1"></i>Watchlist của bạn</p>
      </div>

      <div class="p-5 rounded-2xl bg-slate-900/60 border border-slate-800 shadow-sm">
        <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">Deal Đạt Giá (≥30%)</p>
        <p class="text-3xl font-extrabold text-amber-400 mt-2" x-text="stats.ready_deals"></p>
        <p class="text-xs text-amber-400/80 mt-1"><i class="fa-solid fa-fire mr-1"></i>Sẵn sàng mua ngay</p>
      </div>

      <div class="p-5 rounded-2xl bg-slate-900/60 border border-slate-800 shadow-sm">
        <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">Voucher Xịn Khả Dụng</p>
        <p class="text-3xl font-extrabold text-emerald-400 mt-2" x-text="stats.active_vouchers"></p>
        <p class="text-xs text-emerald-400/80 mt-1"><i class="fa-solid fa-ticket mr-1"></i>Sàn & Video Live</p>
      </div>

      <div class="p-5 rounded-2xl bg-slate-900/60 border border-slate-800 shadow-sm">
        <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">Ngưỡng Lọc Deal</p>
        <p class="text-3xl font-extrabold text-indigo-400 mt-2">≥ 30%</p>
        <p class="text-xs text-slate-400 mt-1"><i class="fa-solid fa-shield-halved mr-1"></i>Chống giá ảo</p>
      </div>
    </div>

    <!-- Quick Add Bar -->
    <div class="p-6 rounded-2xl bg-gradient-to-r from-slate-900 via-indigo-950/30 to-slate-900 border border-slate-800 shadow-lg">
      <h2 class="text-sm font-semibold text-white mb-3 flex items-center space-x-2">
        <i class="fa-solid fa-plus-circle text-indigo-400"></i>
        <span>THÊM SẢN PHẨM MỚI VÀO WATCHLIST</span>
      </h2>
      <form @submit.prevent="addProduct()" class="flex flex-col md:flex-row gap-3">
        <input type="text" x-model="newUrl" placeholder="Dán link sản phẩm Shopee (ví dụ: https://shopee.vn/product/...)"
               required class="flex-1 px-4 py-2.5 rounded-xl bg-slate-950/80 border border-slate-700/80 text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 placeholder-slate-500">
        
        <div class="flex items-center space-x-2">
          <select x-model="newTargetMode" class="px-3 py-2.5 rounded-xl bg-slate-950/80 border border-slate-700/80 text-xs font-medium text-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="PERCENT">Giảm từ (%)</option>
            <option value="PRICE">Giá tiền (VNĐ)</option>
          </select>
          <input type="number" x-model="newTargetVal" required placeholder="30"
                 class="w-24 px-3 py-2.5 rounded-xl bg-slate-950/80 border border-slate-700/80 text-sm font-semibold text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <button type="submit" :disabled="adding" class="px-6 py-2.5 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white rounded-xl text-sm font-semibold shadow-md transition disabled:opacity-50">
          <span x-text="adding ? 'Đang thêm...' : '+ Thêm Sản Phẩm'"></span>
        </button>
      </form>
    </div>

    <!-- Tabs Navigation -->
    <div class="border-b border-slate-800 flex space-x-6 text-sm font-medium">
      <button @click="currentTab = 'watchlist'" :class="{ 'text-indigo-400 border-b-2 border-indigo-400 pb-3': currentTab === 'watchlist', 'text-slate-400 hover:text-slate-200 pb-3': currentTab !== 'watchlist' }">
        <i class="fa-solid fa-list-check mr-2"></i>Danh Sách Watchlist (<span x-text="products.length"></span>)
      </button>
      <button @click="currentTab = 'vouchers'" :class="{ 'text-indigo-400 border-b-2 border-indigo-400 pb-3': currentTab === 'vouchers', 'text-slate-400 hover:text-slate-200 pb-3': currentTab !== 'vouchers' }">
        <i class="fa-solid fa-ticket mr-2"></i>Trạm Voucher Xịn (<span x-text="vouchers.length"></span>)
      </button>
    </div>

    <!-- TAB 1: WATCHLIST PRODUCTS -->
    <div x-show="currentTab === 'watchlist'" class="space-y-4">
      <template x-if="products.length === 0">
        <div class="text-center py-16 bg-slate-900/30 rounded-2xl border border-dashed border-slate-800">
          <i class="fa-solid fa-box-open text-4xl text-slate-600 mb-3"></i>
          <p class="text-sm text-slate-400">Chưa có sản phẩm nào trong Watchlist!</p>
          <p class="text-xs text-slate-500 mt-1">Dán link Shopee vào ô trên hoặc nhắn cho Bot Telegram để thêm.</p>
        </div>
      </template>

      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
        <template x-for="p in products" :key="p.id">
          <div class="p-5 rounded-2xl bg-slate-900/70 border border-slate-800 flex flex-col justify-between hover:border-slate-700 transition relative overflow-hidden group shadow-sm">
            <!-- Badge đạt giá -->
            <div x-show="p.is_deal_ready" class="absolute top-3 right-3 px-2.5 py-1 rounded-full text-[10px] font-bold bg-amber-500/10 text-amber-400 border border-amber-500/30 flex items-center space-x-1 shadow-sm">
              <i class="fa-solid fa-fire text-amber-400 animate-bounce"></i>
              <span>ĐẠT MỤC TIÊU!</span>
            </div>

            <div>
              <div class="flex space-x-3 items-start">
                <img :src="p.image_url || 'https://deo.shopeemobile.com/shopee/shopee-pcmall-live-sg/assets/icon_favicon_1_32.png'"
                     class="w-16 h-16 rounded-xl object-cover border border-slate-800 flex-shrink-0 bg-slate-950">
                <div class="overflow-hidden">
                  <h3 class="text-sm font-semibold text-white line-clamp-2" :title="p.name" x-text="p.name"></h3>
                  <div class="flex items-center space-x-2 mt-1">
                    <span class="text-[10px] uppercase font-bold px-1.5 py-0.5 rounded bg-orange-500/10 text-orange-400 border border-orange-500/20" x-text="p.platform"></span>
                    <span class="text-xs text-slate-400">ID: <span x-text="p.item_id"></span></span>
                  </div>
                </div>
              </div>

              <!-- Price breakdown -->
              <div class="mt-4 p-3.5 rounded-xl bg-slate-950/60 border border-slate-800/80 space-y-1.5">
                <div class="flex justify-between text-xs">
                  <span class="text-slate-400">Giá chuẩn TT:</span>
                  <span class="text-slate-400 line-through" x-text="formatMoney(p.baseline_price)"></span>
                </div>
                <div class="flex justify-between items-baseline">
                  <span class="text-xs font-semibold text-slate-300">Giá thực trả sau mã:</span>
                  <div class="text-right">
                    <span class="text-lg font-extrabold text-emerald-400" x-text="formatMoney(p.final_price)"></span>
                    <span class="text-xs font-bold text-red-400 ml-1" x-text="'-' + p.discount_percent + '%'"></span>
                  </div>
                </div>
                <div class="flex justify-between text-xs text-slate-400 pt-1 border-t border-slate-800/60">
                  <span>Mục tiêu của bạn:</span>
                  <span class="font-medium text-indigo-400" x-text="p.target_mode === 'PERCENT' ? 'Giảm ≥ ' + p.target_value + '%' : '≤ ' + formatMoney(p.target_value)"></span>
                </div>
              </div>

              <!-- Applied Vouchers -->
              <div class="mt-3">
                <p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-1">Mã đã gộp:</p>
                <div class="flex flex-wrap gap-1.5">
                  <template x-for="v in p.applied_vouchers">
                    <span class="px-2 py-0.5 rounded-md text-[11px] bg-indigo-500/10 text-indigo-300 border border-indigo-500/20" x-text="v.label"></span>
                  </template>
                  <template x-if="!p.applied_vouchers || p.applied_vouchers.length === 0">
                    <span class="text-[11px] text-slate-500 italic">Đang canh mã giảm phù hợp...</span>
                  </template>
                </div>
              </div>
            </div>

            <!-- Footer Actions -->
            <div class="mt-5 pt-3 border-t border-slate-800/80 flex items-center justify-between">
              <a :href="p.product_url" target="_blank" class="px-3 py-1.5 bg-orange-600 hover:bg-orange-500 text-white rounded-lg text-xs font-semibold shadow transition flex items-center space-x-1.5">
                <i class="fa-solid fa-cart-shopping"></i>
                <span>Mở Shopee</span>
              </a>
              <button @click="deleteProduct(p.id)" class="text-xs text-rose-400 hover:text-rose-300 px-2.5 py-1 rounded-lg hover:bg-rose-500/10 transition">
                <i class="fa-solid fa-trash mr-1"></i>Xóa
              </button>
            </div>
          </div>
        </template>
      </div>
    </div>

    <!-- TAB 2: VOUCHERS -->
    <div x-show="currentTab === 'vouchers'" class="space-y-6">
      <!-- Category filter pills -->
      <div class="flex flex-wrap gap-2 pb-1">
        <button @click="voucherFilter = 'ALL'" :class="{ 'bg-indigo-600 text-white': voucherFilter === 'ALL', 'bg-slate-900/80 text-slate-400 hover:text-white': voucherFilter !== 'ALL' }" class="px-3.5 py-1.5 rounded-xl text-xs font-semibold transition border border-slate-800">
          Tất Cả (<span x-text="vouchers.length"></span>)
        </button>
        <button @click="voucherFilter = 'Shopee Video'" :class="{ 'bg-indigo-600 text-white': voucherFilter === 'Shopee Video', 'bg-slate-900/80 text-slate-400 hover:text-white': voucherFilter !== 'Shopee Video' }" class="px-3.5 py-1.5 rounded-xl text-xs font-semibold transition border border-slate-800">
          🎬 Shopee Video (20%-50%)
        </button>
        <button @click="voucherFilter = 'Shopee Live'" :class="{ 'bg-indigo-600 text-white': voucherFilter === 'Shopee Live', 'bg-slate-900/80 text-slate-400 hover:text-white': voucherFilter !== 'Shopee Live' }" class="px-3.5 py-1.5 rounded-xl text-xs font-semibold transition border border-slate-800">
          🔴 Shopee Live
        </button>
        <button @click="voucherFilter = 'Mã Toàn Sàn'" :class="{ 'bg-indigo-600 text-white': voucherFilter === 'Mã Toàn Sàn', 'bg-slate-900/80 text-slate-400 hover:text-white': voucherFilter !== 'Mã Toàn Sàn' }" class="px-3.5 py-1.5 rounded-xl text-xs font-semibold transition border border-slate-800">
          ⚡️ Khung Giờ Toàn Sàn
        </button>
        <button @click="voucherFilter = 'Freeship'" :class="{ 'bg-indigo-600 text-white': voucherFilter === 'Freeship', 'bg-slate-900/80 text-slate-400 hover:text-white': voucherFilter !== 'Freeship' }" class="px-3.5 py-1.5 rounded-xl text-xs font-semibold transition border border-slate-800">
          🚚 Freeship Xtra
        </button>
        <button @click="voucherFilter = 'Điện Tử - Công Nghệ'" :class="{ 'bg-indigo-600 text-white': voucherFilter === 'Điện Tử - Công Nghệ', 'bg-slate-900/80 text-slate-400 hover:text-white': voucherFilter !== 'Điện Tử - Công Nghệ' }" class="px-3.5 py-1.5 rounded-xl text-xs font-semibold transition border border-slate-800">
          💻 Điện Tử Công Nghệ
        </button>
        <button @click="voucherFilter = 'Hoàn Xu Xtra'" :class="{ 'bg-indigo-600 text-white': voucherFilter === 'Hoàn Xu Xtra', 'bg-slate-900/80 text-slate-400 hover:text-white': voucherFilter !== 'Hoàn Xu Xtra' }" class="px-3.5 py-1.5 rounded-xl text-xs font-semibold transition border border-slate-800">
          🪙 Hoàn Xu Xtra
        </button>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
        <template x-for="v in filteredVouchers" :key="v.voucher_id">
          <div class="p-5 rounded-2xl bg-slate-900/70 border border-slate-800 flex flex-col justify-between shadow-sm hover:border-slate-700 transition space-y-4">
            <div>
              <div class="flex items-center justify-between">
                <span class="px-2.5 py-0.5 rounded-md text-[10px] font-bold uppercase bg-indigo-500/10 text-indigo-400 border border-indigo-500/20" x-text="v.category || v.voucher_type"></span>
                <span class="text-xs font-mono font-bold text-amber-400" x-text="v.voucher_code"></span>
              </div>
              <p class="text-base font-bold text-white mt-2.5" x-text="v.label"></p>
              <p class="text-xs text-slate-400 mt-1">Đơn tối thiểu: <span class="font-semibold text-slate-200" x-text="formatMoney(v.min_spend)"></span></p>
              <div class="mt-3 p-3 rounded-xl bg-slate-950/70 border border-slate-800/80 text-[11px] text-slate-300 leading-relaxed">
                <p class="font-semibold text-indigo-400 mb-1"><i class="fa-solid fa-circle-info mr-1"></i>Hướng dẫn sử dụng:</p>
                <p class="whitespace-pre-line" x-text="v.guide || 'Lưu mã tại trang khuyến mãi và áp mã khi thanh toán.'"></p>
              </div>
            </div>
            <a :href="v.claim_url || 'https://shopee.vn/m/ma-giam-gia'" target="_blank" class="w-full text-center py-2.5 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-xs font-bold rounded-xl text-white shadow-md transition flex items-center justify-center space-x-2">
              <i class="fa-solid fa-gift"></i>
              <span>Nhận Mã Ngay Trên Shopee</span>
            </a>
          </div>
        </template>
      </div>
    </div>

  </main>

  <script>
    function dashboardApp() {
      return {
        currentTab: 'watchlist',
        voucherFilter: 'ALL',
        products: [],
        vouchers: [],
        get filteredVouchers() {
          if (this.voucherFilter === 'ALL') return this.vouchers;
          return this.vouchers.filter(v => (v.category === this.voucherFilter || v.voucher_type === this.voucherFilter));
        },
        stats: { total_products: 0, ready_deals: 0, active_vouchers: 0, total_alerts: 0 },
        newUrl: '',
        newTargetMode: 'PERCENT',
        newTargetVal: 30,
        adding: false,
        scanning: false,

        async initData() {
          await this.loadAll();
          // Tự động làm mới mỗi 10 giây
          setInterval(() => this.loadAll(), 10000);
        },

        async loadAll() {
          try {
            const [pRes, vRes, sRes] = await Promise.all([
              fetch('/api/products'),
              fetch('/api/vouchers'),
              fetch('/api/stats')
            ]);
            this.products = await pRes.json();
            this.vouchers = await vRes.json();
            this.stats = await sRes.json();
          } catch (e) {
            console.error("Lỗi tải dữ liệu dashboard:", e);
          }
        },

        async addProduct() {
          if (!this.newUrl) return;
          this.adding = true;
          try {
            const res = await fetch('/api/products', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                url: this.newUrl,
                target_mode: this.newTargetMode,
                target_value: parseFloat(this.newTargetVal)
              })
            });
            const data = await res.json();
            if (data.ok) {
              this.newUrl = '';
              await this.loadAll();
            } else {
              alert(data.error || "Không thể thêm sản phẩm!");
            }
          } catch (e) {
            alert("Lỗi khi thêm sản phẩm: " + e);
          } finally {
            this.adding = false;
          }
        },

        async deleteProduct(id) {
          if (!confirm("Bạn có chắc muốn xóa món này khỏi danh sách theo dõi?")) return;
          try {
            await fetch(`/api/products/${id}`, { method: 'DELETE' });
            await this.loadAll();
          } catch (e) {
            alert("Lỗi xóa: " + e);
          }
        },

        async triggerScan() {
          this.scanning = true;
          try {
            await fetch('/api/scan-now', { method: 'POST' });
            await this.loadAll();
          } catch (e) {
            console.error(e);
          } finally {
            this.scanning = false;
          }
        },

        formatMoney(num) {
          if (!num) return '0đ';
          return new Intl.NumberFormat('vi-VN').format(Math.round(num)) + 'đ';
        }
      }
    }
  </script>
</body>
</html>
